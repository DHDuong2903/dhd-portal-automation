services:
  postgres:
    image: postgres:16
    container_name: portal-automation-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal_automation

    # Host port 5433 avoids clashing with a native PostgreSQL on 5432.
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: